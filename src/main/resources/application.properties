spring.application.name=rota-para-todos-api

# Banco Oracle da FIAP. Usuario e senha NAO ficam no codigo (a rubrica tira 10 pontos):
# os valores vem das variaveis de ambiente DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Porta: o Render informa a porta pela variavel PORT (localmente usa 8080)
server.port=${PORT:8080}

# Segredo que assina o token de login (variavel APP_TOKEN_SECRET; se vazio, a API gera um)
app.token.segredo=${APP_TOKEN_SECRET:}

# Nunca devolver stack trace nas respostas de erro
server.error.include-stacktrace=never
